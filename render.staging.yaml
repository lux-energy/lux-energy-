services:
  - type: web
    name: lux-energy-staging-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://lux-energy-staging-web.onrender.com

  - type: web
    name: lux-energy-staging-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_URL
        value: https://lux-energy-staging-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
